<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Producto — Sebastian Black</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico?v=3">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=3">
  <link rel="icon" type="image/png" sizes="64x64" href="/images/ui/favicon.png?v=3">
  <link rel="preconnect" href="https://api.fontshare.com">
  <link href="https://api.fontshare.com/v2/css?f[]=switzer@400,500,700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg: #0f0e0e; --white: #ffffff; --white-50: rgba(255,255,255,0.5); }
    html, body { background: var(--bg); color: var(--white); font-family: 'Switzer', sans-serif; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
    a { color: inherit; text-decoration: none; }

    .nav { position: fixed; top: 0; left: 0; right: 0; z-index: 200; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 22px 40px; }
    .nav-logo { font-size: 13px; font-weight: 500; letter-spacing: -0.13px; text-transform: uppercase; }
    .nav-links { display: flex; gap: 28px; font-size: 13px; font-weight: 500; letter-spacing: -0.13px; text-transform: uppercase; }
    .nav-links a { transition: opacity 0.2s; opacity: 0.5; }
    .nav-links a:hover, .nav-links a.active { opacity: 1; }
    .nav-right { display: flex; align-items: center; justify-content: flex-end; gap: 20px; }
    .nav-year { font-size: 13px; font-weight: 500; color: var(--white-50); letter-spacing: -0.13px; }
    .nav-lang { background: none; border: none; font-family: inherit; font-size: 13px; font-weight: 500; letter-spacing: -0.13px; text-transform: uppercase; color: var(--white-50); cursor: pointer; padding: 0; transition: color 0.2s; }
    .nav-lang:hover { color: var(--white); }

    .page-header { padding: 152px 40px 64px; }
    .page-title { font-size: 80px; font-weight: 500; letter-spacing: -2.4px; line-height: 72px; animation: fadeUp 1s cubic-bezier(0.22,1,0.36,1) 0.1s both; }
    .project-count { font-size: 13px; font-weight: 500; letter-spacing: -0.13px; text-transform: uppercase; color: var(--white-50); margin-top: 20px; }

    .projects-section { padding: 0 40px 120px; }
    .projects-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; }
    .project-card { display: block; overflow: hidden; cursor: none; }
    .project-card.is-coming-soon { cursor: default; pointer-events: none; }
    .project-card.is-coming-soon .project-img-wrap { position: relative; }
    .project-card.is-coming-soon .project-img-wrap img, .project-card.is-coming-soon .project-img-wrap video { filter: grayscale(0.6) brightness(0.55); }
    .project-card.is-coming-soon .project-title, .project-card.is-coming-soon .project-category { color: var(--white-50); }
    .coming-soon-badge { position: absolute; top: 16px; left: 16px; font-size: 10px; font-weight: 500; letter-spacing: 0.5px; text-transform: uppercase; color: var(--white); background: rgba(15,14,14,0.72); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); padding: 6px 12px; border-radius: 100px; border: 1px solid rgba(255,255,255,0.18); z-index: 2; }
    .project-img-wrap { overflow: hidden; }
    .project-img-wrap img, .project-img-wrap video { width: 100%; aspect-ratio: 4/3; object-fit: cover; display: block; transition: transform 0.65s cubic-bezier(0.25,0.46,0.45,0.94); }
    .project-card:hover .project-img-wrap img, .project-card:hover .project-img-wrap video { transform: scale(1.04); }
    .project-meta { padding: 14px 0 0; }
    .project-title { font-size: 28px; font-weight: 500; letter-spacing: -0.84px; line-height: 28px; }
    .project-category { font-size: 12px; font-weight: 500; letter-spacing: 0.36px; text-transform: uppercase; color: var(--white-50); margin-top: 8px; }

    .cursor-ring { position: fixed; top: 0; left: 0; width: 130px; height: 130px; border-radius: 50%; background: var(--white); pointer-events: none; z-index: 9999; transform: translate(-50%,-50%) scale(0.1); opacity: 0; transition: opacity 0.3s ease, transform 0.45s cubic-bezier(0.34,1.56,0.64,1); display: flex; align-items: center; justify-content: center; }
    .cursor-ring.is-active { opacity: 1; transform: translate(-50%,-50%) scale(1); }
    .cursor-ring svg { width: 38px; height: 38px; opacity: 0; transform: scale(0.5); transition: opacity 0.25s 0.15s ease, transform 0.3s 0.15s ease; }
    .cursor-ring.is-active svg { opacity: 1; transform: scale(1); }

    [data-reveal] { opacity: 0; transform: translateY(28px); transition: opacity 0.85s cubic-bezier(0.22,1,0.36,1), transform 0.85s cubic-bezier(0.22,1,0.36,1); transition-delay: var(--reveal-delay, 0ms); }
    [data-reveal].is-visible { opacity: 1; transform: translateY(0); }

    footer { border-top: 1px solid rgba(255,255,255,0.1); padding: 40px 40px 48px; display: grid; grid-template-columns: 1fr 1fr 1fr; align-items: end; gap: 40px; }
    .footer-address { font-size: 12px; font-weight: 500; letter-spacing: 0.24px; line-height: 14.4px; text-transform: uppercase; color: var(--white-50); }
    .footer-social { margin-top: 28px; display: flex; flex-direction: column; gap: 6px; }
    .footer-social a { font-size: 13px; font-weight: 500; letter-spacing: -0.13px; text-transform: uppercase; transition: opacity 0.2s; }
    .footer-social a:hover { opacity: 0.5; }
    .footer-center { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 24px; }
    .footer-cta-title { font-size: 28px; font-weight: 500; line-height: 28px; letter-spacing: -0.84px; }
    .footer-copy { font-size: 12px; font-weight: 500; letter-spacing: 0.24px; text-transform: uppercase; color: var(--white-50); margin-top: 2px; }
    .footer-right { display: flex; justify-content: flex-end; align-items: flex-end; }
    .footer-back-top { font-size: 12px; font-weight: 500; letter-spacing: 0.24px; text-transform: uppercase; color: var(--white-50); transition: opacity 0.2s, color 0.2s; cursor: pointer; }
    .footer-back-top:hover { color: var(--white); opacity: 0.9; }
    .btn-pill { display: inline-flex; align-items: center; font-size: 12px; font-weight: 500; letter-spacing: 0.24px; text-transform: uppercase; border: 1px solid rgba(255,255,255,0.25); padding: 13px 28px; border-radius: 100px; transition: background 0.25s, color 0.25s, border-color 0.25s; }
    .btn-pill:hover { background: var(--white); color: var(--bg); border-color: var(--white); }

    @keyframes fadeUp { from { opacity: 0; transform: translateY(22px); } to { opacity: 1; transform: translateY(0); } }
    .nav { animation: fadeUp 0.9s cubic-bezier(0.22,1,0.36,1) both; }

    @media (max-width: 768px) {
      .nav { padding: 18px 20px; grid-template-columns: 1fr 1fr; }
      .nav-links { display: none; }
      .page-header { padding: 120px 20px 48px; }
      .page-title { font-size: 40px; line-height: 38px; letter-spacing: -1.2px; }
      .projects-section { padding: 0 20px 80px; }
      .projects-grid { grid-template-columns: 1fr; }
      .project-title { font-size: 20px; line-height: 20px; letter-spacing: -0.6px; }
      footer { padding: 40px 20px 48px; grid-template-columns: 1fr; gap: 48px; }
      .footer-right { justify-content: flex-start; }
    }
    .nav-hamburger { display: none; background: none; border: none; cursor: pointer; padding: 4px; flex-direction: column; justify-content: center; gap: 5px; }
    .nav-hamburger span { display: block; width: 22px; height: 1.5px; background: var(--white); transition: transform 0.35s cubic-bezier(0.22,1,0.36,1), opacity 0.2s; transform-origin: center; }
    .nav-hamburger.is-open span:nth-child(1) { transform: translateY(6.5px) rotate(45deg); }
    .nav-hamburger.is-open span:nth-child(2) { opacity: 0; transform: scaleX(0); }
    .nav-hamburger.is-open span:nth-child(3) { transform: translateY(-6.5px) rotate(-45deg); }
    .nav-mobile { position: fixed; inset: 0; background: var(--bg); z-index: 190; display: flex; flex-direction: column; padding: 96px 20px 48px; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
    .nav-mobile.is-open { opacity: 1; pointer-events: all; }
    .nav-mobile-links { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 4px; }
    .nav-mobile-links a { font-size: 52px; font-weight: 500; letter-spacing: -2px; line-height: 1.05; opacity: 0; transform: translateY(20px); transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.22,1,0.36,1), color 0.2s; }
    .nav-mobile.is-open .nav-mobile-links a { opacity: 0.5; transform: translateY(0); }
    .nav-mobile.is-open .nav-mobile-links a:nth-child(1) { transition-delay: 0.05s; }
    .nav-mobile.is-open .nav-mobile-links a:nth-child(2) { transition-delay: 0.10s; }
    .nav-mobile.is-open .nav-mobile-links a:nth-child(3) { transition-delay: 0.15s; }
    .nav-mobile.is-open .nav-mobile-links a:nth-child(4) { transition-delay: 0.20s; }
    .nav-mobile.is-open .nav-mobile-links a.active, .nav-mobile.is-open .nav-mobile-links a:hover { opacity: 1; }
    .nav-mobile-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 24px; }
    .nav-mobile-footer-lang { background: none; border: none; font-family: inherit; font-size: 13px; font-weight: 500; letter-spacing: -0.13px; text-transform: uppercase; color: var(--white-50); cursor: pointer; padding: 0; transition: color 0.2s; }
    .nav-mobile-footer-year { font-size: 13px; font-weight: 500; letter-spacing: -0.13px; color: var(--white-50); }
    @media (max-width: 768px) { .nav-hamburger { display: flex; } .nav-year { display: none; } .nav-lang { display: none; } }
  </style>
  <script src="/js/projects.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/contact.js"></script>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-8B50J8PMQ0"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-8B50J8PMQ0');
  </script>
</head>
<body>

  <div class="cursor-ring" id="cursorRing" aria-hidden="true">
    <svg viewBox="0 0 38 38" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M10 28 L28 10 M28 10 H14 M28 10 V24" stroke="#0f0e0e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>

  <header class="nav">
    <a href="/" class="nav-logo">Sebastian Black</a>
    <nav class="nav-links">
      <a href="/projects/branding/" data-i18n="nav.branding" >Branding</a>
      <a href="/projects/product/" data-i18n="nav.product" class="active">Producto</a>
      <a href="/#about" data-i18n="nav.about">Sobre mí</a>
      <a href="/#contact" data-i18n="nav.contact">Contacto</a>
    </nav>
    <div class="nav-right">
      <button class="nav-lang" data-lang-btn>EN</button>
      <span class="nav-year" data-i18n="nav.year">®2026</span>
      <button class="nav-hamburger" id="navHamburger" aria-label="Menu"><span></span><span></span><span></span></button>
    </div>
  </header>
  <div class="nav-mobile" id="navMobile">
    <div class="nav-mobile-links">
      <a href="/projects/branding/" data-i18n="nav.branding">Branding</a>
      <a href="/projects/product/" data-i18n="nav.product" class="active">Producto</a>
      <a href="/#about" data-i18n="nav.about">Sobre mí</a>
      <a href="/#contact" data-i18n="nav.contact">Contacto</a>
    </div>
    <div class="nav-mobile-footer">
      <button class="nav-mobile-footer-lang" data-lang-btn>EN</button>
      <span class="nav-mobile-footer-year" data-i18n="nav.year">®2026</span>
    </div>
  </div>

  <div class="page-header">
    <h1 class="page-title" data-i18n="nav.product">Producto</h1>
    <p class="project-count" id="project-count"></p>
  </div>

  <section class="projects-section">
    <div class="projects-grid" id="projects-grid"></div>
  </section>

  <footer>
    <div>
      <div class="footer-address" data-i18n="footer.address">Lima, Perú</div>
      <div class="footer-social">
        <a href="https://www.instagram.com/sebasblack.pe/" target="_blank" rel="noopener" data-cta="instagram">Instagram</a>
        <a href="https://www.linkedin.com/in/sebastianblack/" target="_blank" rel="noopener" data-cta="linkedin">LinkedIn</a>
      </div>
    </div>
    <div class="footer-center">
      <p class="footer-cta-title" data-i18n="footer.cta">¿Te gusta<br>lo que ves?</p>
      <a href="https://wa.me/51992325564" class="btn-pill" target="_blank" rel="noopener" data-i18n="footer.connect" data-cta="whatsapp">Hablemos</a>
      <p class="footer-copy" data-i18n="footer.copy">2026 ® Sebastian Black</p>
    </div>
    <div class="footer-right">
      <a href="#" class="footer-back-top" onclick="window.scrollTo({top:0,behavior:'smooth'});return false;" data-i18n="footer.back">↑ Volver arriba</a>
    </div>
  </footer>

  <script>
  (function () {
    const TAG  = 'product';
    const list = PROJECTS.filter(p => p.tags.includes(TAG) && !p.hidden);
    const grid = document.getElementById('projects-grid');
    const t    = window.TRANSLATIONS || {};

    function setCount() {
      var label = (window.TRANSLATIONS || {})['projects.count'] || 'Proyectos';
      document.getElementById('project-count').textContent = String(list.length).padStart(2,'0') + ' ' + label;
    }
    setCount();
    setTimeout(setCount, 500);

    list.forEach(function (p, i) {
      const delay = (i % 2) * 80;
      const title = t['project.' + p.id + '.title'] || p.id;
      const cat   = t['project.' + p.id + '.category'] || '';
      const card  = document.createElement(p.comingSoon ? 'div' : 'a');
      if (!p.comingSoon) card.href = p.url;
      card.className = 'project-card' + (p.comingSoon ? ' is-coming-soon' : '');
      card.setAttribute('data-reveal', '');
      card.style.setProperty('--reveal-delay', delay + 'ms');
      const media = p.videoThumb
        ? '<video src="' + p.videoThumb + '" autoplay muted loop playsinline></video>'
        : '<img src="' + p.thumb + '" alt="' + title + '" loading="lazy">';
      var badge = p.comingSoon ? '<span class="coming-soon-badge" data-i18n="project.coming-soon">Próximamente</span>' : '';
      card.innerHTML =
        '<div class="project-img-wrap">' + media + badge + '</div>' +
        '<div class="project-meta">' +
          '<div class="project-title" data-i18n="project.' + p.id + '.title">' + title + '</div>' +
          '<div class="project-category" data-i18n="project.' + p.id + '.category">' + cat + '</div>' +
        '</div>';
      grid.appendChild(card);
    });

    const ring  = document.getElementById('cursorRing');
    let mx=0,my=0,cx=0,cy=0;
    document.addEventListener('mousemove', e => { mx=e.clientX; my=e.clientY; });
    (function loop(){ cx+=(mx-cx)*0.14; cy+=(my-cy)*0.14; ring.style.left=cx+'px'; ring.style.top=cy+'px'; requestAnimationFrame(loop); })();
    document.querySelectorAll('.project-card').forEach(c => {
      c.addEventListener('mouseenter', () => ring.classList.add('is-active'));
      c.addEventListener('mouseleave', () => ring.classList.remove('is-active'));
    });

    const observer = new IntersectionObserver(entries => {
      entries.forEach(e => { if(!e.isIntersecting) return; e.target.classList.add('is-visible'); observer.unobserve(e.target); });
    }, { threshold: 0.12 });
    document.querySelectorAll('[data-reveal]').forEach(el => observer.observe(el));
  })();
  </script>
  <script>
  (function () {
    const btn = document.getElementById('navHamburger');
    const menu = document.getElementById('navMobile');
    if (!btn || !menu) return;
    btn.addEventListener('click', function () {
      const open = menu.classList.toggle('is-open');
      btn.classList.toggle('is-open', open);
      document.body.style.overflow = open ? 'hidden' : '';
    });
    menu.querySelectorAll('a').forEach(function (a) {
      a.addEventListener('click', function () {
        menu.classList.remove('is-open');
        btn.classList.remove('is-open');
        document.body.style.overflow = '';
      });
    });
  })();
  </script>

</body>
</html>
